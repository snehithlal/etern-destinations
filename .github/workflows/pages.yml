name: Deploy permitted preview to GitHub Pages
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Origin, e.g. https://OWNER.github.io (no repository path)'
        required: true
        type: string
      base_path:
        description: 'Repository prefix; use / for a root custom domain'
        default: /etern-destinations
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ inputs.site_url }}
      BASE_PATH: ${{ inputs.base_path }}
      PUBLIC_SITE_LIVE: 'false'
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static output
        id: deployment
        uses: actions/deploy-pages@v4
